name: Site pipeline (Windows Environment)

on:
  push:
    branches: [main, p11_ci_cd, p11_perbaikan-dan-verifikasi-proyek, v1.0, v1.0_dev, v1.1, V1.1]
  pull_request:
    branches: [main, p11_ci_cd, p11_perbaikan-dan-verifikasi-proyek, v1.0, v1.0_dev, v1.1, V1.1]

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (Windows Runner)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (Windows)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Jalankan Tes Otomatis (PowerShell)
        working-directory: cicd-demo
        run: npm test

      - name: Jalankan Build Proyek (PowerShell)
        working-directory: cicd-demo
        run: npm run build

      - name: Unggah Hasil Build (Artifact Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: cicd-demo/dist

  deploy:
    name: Deploy to GitHub Pages (Windows Runner)
    if: github.event_name == 'push'
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Deploy ke GitHub Pages
        uses: actions/deploy-pages@v4
        id: d
        continue-on-error: true
