name: OptikExpress CI Pipeline (Windows Environment)

on:
  push:
    branches: [main, p11_ci_cd, p11_perbaikan-dan-verifikasi-proyek, v1.0, v1.0_dev, v1.1]
  pull_request:
    branches: [main, p11_ci_cd, p11_perbaikan-dan-verifikasi-proyek, v1.0, v1.0_dev, v1.1]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend 200 Unit Tests (Windows Runner)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (Windows)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Backend Dependencies (Windows PowerShell)
        working-directory: backend
        run: npm install

      - name: Run 200 Unit Tests (Windows PowerShell)
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend Build & Verification (Windows Runner)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (Windows)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend Dependencies (Windows PowerShell)
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend (Windows PowerShell)
        working-directory: frontend
        run: npm run build
