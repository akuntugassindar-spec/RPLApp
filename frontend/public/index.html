<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0284c7" />
    <meta
      name="description"
      content="Sistem Informasi Layanan Antar-Jemput Kacamata - Solusi praktis perbaikan dan penggantian lensa kacamata langsung dari rumah Anda."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet OpenStreetMap CDN for Live Courier Tracking -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      // Safe guard untuk mencegah error Leaflet internal '_leaflet_pos' of undefined saat transisi peta
      if (typeof window !== 'undefined') {
        var patchLeaflet = function() {
          if (window.L && window.L.Map && !window.L.Map.prototype._safeLeafletPosPatch) {
            window.L.Map.prototype._safeLeafletPosPatch = true;
            var origGetMapPanePos = window.L.Map.prototype._getMapPanePos;
            if (typeof origGetMapPanePos === 'function') {
              window.L.Map.prototype._getMapPanePos = function () {
                if (!this._mapPane) return new window.L.Point(0, 0);
                try {
                  return origGetMapPanePos.call(this);
                } catch (e) {
                  return new window.L.Point(0, 0);
                }
              };
            }
          }
        };
        patchLeaflet();
        window.addEventListener('load', patchLeaflet);
      }
    </script>
    <title>Layanan Antar-Jemput Kacamata</title>
  </head>
  <body>
    <noscript>Anda perlu mengaktifkan JavaScript untuk menjalankan aplikasi ini.</noscript>
    <div id="root"></div>
  </body>
</html>
